[project]
name = "sales-forecasting"
version = "0.1.0"
description = "Daily store-item sales forecasting with a 90-day horizon."
authors = [{ name = "Daria Romanenko" }]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2,<3.0",
    "neuralforecast==3.3.0",
    "torch==2.9.1",
]

[tool.poetry]
packages = [{ include = "sales_forecasting", from = "src" }]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.11,<1.0"
pytest = ">=8.3,<9.0"
pre-commit = ">=4.2,<5.0"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
