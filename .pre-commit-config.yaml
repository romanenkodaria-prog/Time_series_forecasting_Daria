minimum_pre_commit_version: "4.2.0"
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: poetry run ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format
        entry: poetry run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
